name: Deploy to GitHub Pages

# The static build is the same application: web/ plus the multispy package,
# which Pyodide loads into the browser and runs in-process. Nothing is compiled
# and no dependencies are installed -- tools/build_static.py only copies and
# renders, so the job needs plain CPython and nothing else.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never let two deploys race, but let a running one finish rather than
# cancelling it half way through replacing the live site
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the static bundle
        run: python tools/build_static.py --out dist

      - name: Check the bundle has what the browser needs
        run: |
          set -e
          for f in index.html app.js backend.js viewer3d.js config.js .nojekyll \
                   py/multispy/__init__.py py/multispy/solve.py py/multispy/webapp.py \
                   docs/readme.html docs/tutorial.html samples/index.json; do
            test -f "dist/$f" || { echo "missing dist/$f"; exit 1; }
          done
          grep -q "pyodide" dist/config.js || { echo "config.js is not the static one"; exit 1; }
          # every sample the manifest advertises has to be there to click on,
          # and a sample that 404s is worse than one the menu never offered
          python - <<'PY'
          import json, pathlib, sys
          manifest = pathlib.Path("dist/samples/index.json")
          entries = json.loads(manifest.read_text())
          if not entries:
              sys.exit("samples/index.json is empty; nothing would appear in the menu")
          for entry in entries:
              blob = pathlib.Path("dist/samples") / entry["file"]
              if not blob.is_file():
                  sys.exit(f"manifest lists {entry['file']} but it was not copied")
              if blob.stat().st_size != entry["bytes"]:
                  sys.exit(f"{entry['file']} is {blob.stat().st_size} bytes, manifest says {entry['bytes']}")
              print(f"  sample {entry['name']}: {entry['images']} photos, {blob.stat().st_size:,} bytes")
          PY
          echo "bundle looks right"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
